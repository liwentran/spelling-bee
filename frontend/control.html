<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controller - Spelling Bee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: white; overscroll-behavior-y: contain; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-20">
    <!-- Session Bar -->
    <div class="sticky top-0 bg-gray-900 border-b border-gray-700 p-3 z-10 flex flex-wrap justify-between items-center gap-2">
        <select id="session-select" class="bg-gray-800 text-white border border-gray-600 rounded p-2 text-lg min-w-[150px] flex-grow max-w-[240px]">
            <option value="">Select Session...</option>
        </select>
        <div class="flex items-center space-x-2">
            <button id="btn-copy-tv" class="hidden text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1.5 rounded font-medium shadow-sm transition items-center gap-1">
                <span>📺 Copy TV Link</span>
            </button>
            <span id="round-display" class="font-bold text-yellow-400 text-sm">Round 1</span>
            <div id="conn-status" class="w-3 h-3 rounded-full bg-red-500"></div>
        </div>
    </div>

    <!-- Nav -->
    <div class="bg-gray-800 border-b border-gray-700 px-3 py-2 flex space-x-4 text-sm">
        <a href="/static/setup.html" class="text-gray-400 hover:text-yellow-400">Setup</a>
        <span class="text-yellow-400 font-bold">Control</span>
        <a href="/static/display.html" class="text-gray-400 hover:text-yellow-400">Display</a>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="p-4 space-y-6 hidden">

        <!-- Players (individual mode) / Teams (team mode) -->
        <div>
            <h3 id="select-heading" class="text-sm text-gray-400 mb-2 uppercase tracking-wide">Select Player</h3>
            <div id="player-list" class="flex overflow-x-auto hide-scroll space-x-3 pb-2"></div>
            <!-- Round progress: who has gone this round, and who's next -->
            <div class="mt-2 flex items-center justify-between gap-3">
                <div id="round-status" class="text-sm text-gray-400"></div>
                <button id="btn-next-up" class="hidden bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold active:scale-95 transition-transform whitespace-nowrap"></button>
            </div>
        </div>

        <!-- Words -->
        <div>
            <div class="flex justify-between items-end mb-2">
                <h3 class="text-sm text-gray-400 uppercase tracking-wide">Select Word</h3>
                <div class="flex space-x-2 text-sm bg-gray-800 rounded p-1">
                    <button id="tab-player-words" class="px-2 py-1 rounded bg-gray-700">Player's</button>
                    <button id="tab-pool-words" class="px-2 py-1 rounded">Pool</button>
                    <button id="tab-all-words" class="px-2 py-1 rounded">All</button>
                </div>
            </div>
            <div id="word-list" class="h-48 overflow-y-auto bg-gray-800 rounded-lg p-2 space-y-2 border border-gray-700">
                <div class="text-center text-gray-500 py-4">Select a player first</div>
            </div>
        </div>

        <!-- What the TV shows of the word: all of it, or only the first letter + definition -->
        <button id="btn-hide-word" class="w-full bg-gray-800 border border-gray-600 py-3 rounded-xl text-lg font-semibold active:scale-95 transition-transform"></button>

        <!-- Pronounce -->
        <button id="btn-pronounce" disabled class="w-full bg-purple-700 hover:bg-purple-600 py-4 rounded-xl text-2xl font-bold shadow-lg active:scale-95 transition-transform disabled:opacity-40 disabled:active:scale-100">🔊 Pronounce Word</button>

        <!-- Timer -->
        <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 text-center">
            <div id="timer-display" class="text-5xl font-mono font-bold mb-4" style="font-variant-numeric: tabular-nums;">02:00</div>
            <div class="w-full bg-gray-700 h-2 rounded-full mb-4 overflow-hidden">
                <div id="timer-bar" class="h-full bg-green-500 w-full transition-all duration-1000"></div>
            </div>
            <div class="flex justify-center space-x-4">
                <button id="btn-timer-start" class="bg-green-600 w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition-transform">▶</button>
                <button id="btn-timer-pause" class="bg-yellow-600 w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition-transform">⏸</button>
                <button id="btn-timer-reset" class="bg-gray-600 w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition-transform">↺</button>
            </div>
            <div class="flex items-center justify-center gap-3 mt-4 text-sm">
                <span class="text-gray-400">Time per word</span>
                <button id="btn-timer-minus" class="bg-gray-700 px-3 py-2 rounded-lg font-bold active:scale-95 transition-transform disabled:opacity-40">−15s</button>
                <span id="timer-length" class="font-mono font-bold w-12">2:00</span>
                <button id="btn-timer-plus" class="bg-gray-700 px-3 py-2 rounded-lg font-bold active:scale-95 transition-transform disabled:opacity-40">+15s</button>
            </div>
        </div>

        <!-- Reveal Info -->
        <div>
            <h3 class="text-sm text-gray-400 mb-2 uppercase tracking-wide">Reveal Info on TV</h3>
            <div class="grid grid-cols-2 gap-3">
                <button class="reveal-btn bg-gray-800 border border-gray-600 py-3 rounded-lg text-lg active:scale-95 transition-transform" data-type="definition">📖 Definition</button>
                <button class="reveal-btn bg-gray-800 border border-gray-600 py-3 rounded-lg text-lg active:scale-95 transition-transform" data-type="sentence">📝 Sentence</button>
                <button class="reveal-btn bg-gray-800 border border-gray-600 py-3 rounded-lg text-lg active:scale-95 transition-transform" data-type="origin">🌍 Origin</button>
                <button class="reveal-btn bg-gray-800 border border-gray-600 py-3 rounded-lg text-lg active:scale-95 transition-transform" data-type="part_of_speech">🔤 Part of Speech</button>
                <button class="reveal-btn bg-gray-800 border border-gray-600 py-3 rounded-lg text-lg col-span-2 active:scale-95 transition-transform" data-type="alternate_pronunciations">🔊 Alt. Pronunciations</button>
            </div>
        </div>

        <!-- Judge Actions -->
        <div>
            <h3 class="text-sm text-gray-400 mb-2 uppercase tracking-wide">Judge Actions</h3>
            <div class="flex space-x-4 mb-4">
                <button id="btn-correct" class="flex-1 bg-green-600 hover:bg-green-500 active:bg-green-400 py-6 rounded-xl text-3xl font-bold shadow-lg shadow-green-900/50 active:scale-95 transition-transform">✅ CORRECT</button>
                <button id="btn-incorrect" class="flex-1 bg-red-600 hover:bg-red-500 active:bg-red-400 py-6 rounded-xl text-3xl font-bold shadow-lg shadow-red-900/50 active:scale-95 transition-transform">❌ INCORRECT</button>
            </div>
            <button id="btn-timeout" class="w-full bg-orange-600 hover:bg-orange-500 active:bg-orange-400 py-4 rounded-xl text-xl font-bold shadow-lg active:scale-95 transition-transform">⏰ TIMEOUT</button>
            <button id="btn-undo" class="hidden w-full mt-4 bg-gray-800 border-2 border-gray-500 py-3 rounded-xl text-lg font-semibold active:scale-95 transition-transform"></button>
        </div>

        <!-- Quick Actions -->
        <div>
            <h3 class="text-sm text-gray-400 mb-2 uppercase tracking-wide">Quick Actions</h3>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-clear" class="bg-gray-700 py-3 rounded-lg active:scale-95 transition-transform">Clear Display</button>
                <button id="btn-scoreboard" class="bg-blue-700 py-3 rounded-lg active:scale-95 transition-transform">Scoreboard</button>
                <button id="btn-next-round" class="bg-indigo-700 py-3 rounded-lg col-span-2 font-bold active:scale-95 transition-transform">Next Round ➡</button>
            </div>
        </div>
    </div>

    <!-- ⋯ menu for a scored word (bottom sheet) -->
    <div id="turn-menu" onclick="window.closeTurnMenu()" class="hidden fixed inset-0 bg-black/70 z-30 flex items-end"></div>

    <script type="module">
        import * as api from './js/api.js';
        import * as ws from './js/ws.js';

        let state = {};
        let sessions = [];
        let players = [];
        let teams = [];
        let words = [];
        let turns = []; // judged attempts, for the round/result tag and ⋯ menu on used words
        let gameMode = 'individual'; // individual, team (from session; server state is authoritative)
        let selectedPlayerId = null;
        let selectedTeamId = null; // team mode only
        // Hide the word on the TV (first letter + definition only). Saved on this phone and
        // re-sent whenever the server disagrees, so a server restart doesn't reveal words.
        let hideWord = false;
        try { hideWord = localStorage.getItem('hideWord') === '1'; } catch (e) {}
        let lastDataVersion = null;
        let latestWinner = null; // elimination winner, sent with result/scoreboard broadcasts
        let wordTab = 'player'; // player (or team's, in team mode), pool, all
        let timerInterval = null;
        let timerSeconds = 120;
        let timerDuration = 120;
        let timerRunning = false;

        const dom = {
            select: document.getElementById('session-select'),
            main: document.getElementById('main-content'),
            connStatus: document.getElementById('conn-status'),
            playerList: document.getElementById('player-list'),
            selectHeading: document.getElementById('select-heading'),
            roundStatus: document.getElementById('round-status'),
            nextUp: document.getElementById('btn-next-up'),
            undo: document.getElementById('btn-undo'),
            wordList: document.getElementById('word-list'),
            roundDisplay: document.getElementById('round-display'),
            timerDisplay: document.getElementById('timer-display'),
            timerBar: document.getElementById('timer-bar')
        };

        async function init() {
            try {
                sessions = await api.fetchSessions();
                dom.select.innerHTML = '<option value="">Select Session...</option>' +
                    sessions.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

                const btnCopyTv = document.getElementById('btn-copy-tv');
                btnCopyTv.onclick = async () => {
                    const sid = dom.select.value;
                    if (!sid) return;
                    const url = `${window.location.origin}/static/display.html?session=${sid}`;
                    try {
                        await navigator.clipboard.writeText(url);
                        btnCopyTv.innerHTML = '<span>✓ Copied!</span>';
                        setTimeout(() => { btnCopyTv.innerHTML = '<span>📺 Copy TV Link</span>'; }, 1800);
                    } catch (err) {
                        prompt('Copy this link for your TV:', url);
                    }
                };

                dom.select.onchange = async (e) => {
                    const sid = e.target.value;
                    if (sid) {
                        btnCopyTv.classList.remove('hidden');
                        btnCopyTv.classList.add('flex');
                        dom.main.classList.remove('hidden');
                        players = await api.fetchPlayers(sid);
                        words = await api.fetchWords(sid);
                        turns = await api.fetchTurns(sid);
                        teams = await api.fetchTeams(sid);

                        // Get session details for timer duration
                        const sess = await api.getSession(sid);
                        timerDuration = sess.timer_duration_seconds || 120;
                        timerSeconds = timerDuration;
                        updateTimerDisplay();
                        setGameMode(sess.game_mode);

                        ws.connect(sid);
                        ws.onStateUpdate(handleStateUpdate);
                        dom.connStatus.classList.replace('bg-red-500', 'bg-green-500');
                    } else {
                        btnCopyTv.classList.add('hidden');
                        btnCopyTv.classList.remove('flex');
                        dom.main.classList.add('hidden');
                        ws.disconnect();
                        dom.connStatus.classList.replace('bg-green-500', 'bg-red-500');
                        stopTimer();
                    }
                };

                // Links from Setup's "Copy Controller Link" carry ?session=ID; open that session directly
                const linked = new URLSearchParams(window.location.search).get('session');
                if (linked && sessions.some(s => s.id === linked)) {
                    dom.select.value = linked;
                    dom.select.dispatchEvent(new Event('change'));
                }
            } catch (e) { console.error(e); }
        }

        function setGameMode(mode) {
            gameMode = mode || 'individual';
            const isTeam = gameMode === 'team';
            dom.selectHeading.textContent = isTeam ? 'Select Team' : 'Select Player';
            tabButtons.player.textContent = isTeam ? "Team's" : "Player's";
        }

        function handleStateUpdate(msg) {
            const s = msg.state;
            state = s;
            dom.roundDisplay.textContent = `Round ${s.round_number || 1}`;
            if (s.game_mode && s.game_mode !== gameMode) setGameMode(s.game_mode);
            // The server is authoritative for who's up (Next Round and Undo change it too)
            selectedTeamId = s.current_team_id;
            selectedPlayerId = s.current_player_id;
            // A turn was judged or undone: refetch so Used words and eliminations show
            const turnsChanged = lastDataVersion !== null && s.data_version !== lastDataVersion;
            if ('winner' in msg) latestWinner = msg.winner;
            else if (turnsChanged) latestWinner = null; // e.g. an undo brought a team back
            if (turnsChanged) refreshData();
            lastDataVersion = s.data_version;

            // Sync timer state from server
            if (s.timer_seconds_remaining !== undefined) {
                timerSeconds = s.timer_seconds_remaining;
            }
            if (s.timer_running && !timerRunning) {
                startLocalTimer();
            } else if (!s.timer_running && timerRunning) {
                stopTimer();
            }
            updateTimerDisplay();

            // Reveal buttons highlight
            const revealedInfo = s.revealed_info || [];
            document.querySelectorAll('.reveal-btn').forEach(btn => {
                const type = btn.dataset.type;
                if (revealedInfo.includes(type)) {
                    btn.classList.add('bg-blue-600', 'border-blue-400');
                    btn.classList.remove('bg-gray-800', 'border-gray-600');
                } else {
                    btn.classList.remove('bg-blue-600', 'border-blue-400');
                    btn.classList.add('bg-gray-800', 'border-gray-600');
                }
            });

            document.getElementById('btn-pronounce').disabled = !s.current_word_id;
            if (!!s.hide_word !== hideWord) ws.setHideWord(hideWord);

            // Judge once per word; Undo reopens it
            const owner = gameMode === 'team' ? s.current_team_id : s.current_player_id;
            ['btn-correct', 'btn-incorrect', 'btn-timeout'].forEach(id => {
                const btn = document.getElementById(id);
                btn.disabled = !owner || !s.current_word_id || !!s.result;
                btn.classList.toggle('opacity-30', btn.disabled);
            });
            const lt = s.last_turn;
            dom.undo.classList.toggle('hidden', !lt);
            if (lt) dom.undo.textContent = `↩ Undo ${RESULT_LABEL[lt.result] || lt.result} · ${lt.name || ''} · "${lt.word || ''}"`;

            // Timer ticks arrive every second; only rebuild the lists when something else changed
            const { timer_running, timer_seconds_remaining, timer_duration, ...listState } = s;
            const listKey = JSON.stringify(listState);
            if (listKey !== lastListKey) {
                lastListKey = listKey;
                renderPlayers();
                renderWords();
                renderRoundStatus();
            }
        }
        let lastListKey = null;
        const RESULT_LABEL = { correct: '✅ Correct', incorrect: '❌ Incorrect', timeout: '⏰ Timeout' };

        async function refreshData() {
            const sid = dom.select.value;
            if (!sid) return;
            try {
                [words, players, teams, turns] = await Promise.all([api.fetchWords(sid), api.fetchPlayers(sid), api.fetchTeams(sid), api.fetchTurns(sid)]);
                renderPlayers();
                renderWords();
                renderRoundStatus();
            } catch (e) { console.error('Failed to refresh:', e); }
        }

        // "Round 2 · 1 of 3 teams done" plus a button for the next one who hasn't gone yet
        function renderRoundStatus() {
            const isTeam = gameMode === 'team';
            const noun = isTeam ? 'teams' : 'players';
            const active = (isTeam ? teams : players).filter(x => !x.eliminated);
            const done = new Set(state.round_done || []);
            const waiting = active.filter(x => !done.has(x.id));
            const doneCount = active.length - waiting.length;
            const currentId = isTeam ? state.current_team_id : state.current_player_id;

            let text = `Round ${state.round_number || 1} · ${doneCount} of ${active.length} ${noun} done`;
            if (latestWinner) text = `🏆 ${latestWinner.name} wins!`;
            else if (active.length && !waiting.length) text = `Round ${state.round_number || 1} complete. Show the Scoreboard, then tap Next Round.`;
            dom.roundStatus.textContent = text;

            // Suggest the next one once the current one has been judged (or nobody is up)
            const next = waiting.find(x => x.id !== currentId);
            const show = !latestWinner && next && (!currentId || done.has(currentId));
            dom.nextUp.classList.toggle('hidden', !show);
            if (show) {
                dom.nextUp.textContent = `Next up: ${next.name} ➡`;
                dom.nextUp.onclick = () => isTeam ? window.selectTeam(next.id) : window.selectPlayer(next.id);
            }
        }

        // --- Timer Logic (runs on controller, syncs to display via WS) ---
        function startLocalTimer() {
            if (timerRunning) return;
            timerRunning = true;
            updateTimerDisplay(); // disables the length buttons right away
            timerInterval = setInterval(() => {
                timerSeconds = Math.max(0, timerSeconds - 1);
                ws.updateTimer(timerSeconds);
                updateTimerDisplay();
                if (timerSeconds <= 0) {
                    stopTimer();
                    ws.markTimeout();
                }
            }, 1000);
        }

        function stopTimer() {
            timerRunning = false;
            clearInterval(timerInterval);
            updateTimerDisplay();
        }

        const fmtTime = (secs) => `${Math.floor(secs / 60)}:${(secs % 60).toString().padStart(2, '0')}`;

        // Change the session's time per word (saved, so the TV and future visits use it). Resets the clock.
        async function changeTimerLength(delta) {
            if (timerRunning) return;
            const next = Math.min(600, Math.max(15, timerDuration + delta));
            if (next === timerDuration) return;
            timerDuration = next;
            timerSeconds = next;
            ws.resetTimer(next);
            updateTimerDisplay();
            try { await api.updateSession(dom.select.value, { timer_duration_seconds: next }); }
            catch (e) { console.error('Failed to save timer length:', e); }
        }
        document.getElementById('btn-timer-minus').onclick = () => changeTimerLength(-15);
        document.getElementById('btn-timer-plus').onclick = () => changeTimerLength(15);

        function updateTimerDisplay() {
            document.getElementById('timer-length').textContent = fmtTime(timerDuration);
            // Length can't change mid-countdown
            document.getElementById('btn-timer-minus').disabled = timerRunning;
            document.getElementById('btn-timer-plus').disabled = timerRunning;
            const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const s = (timerSeconds % 60).toString().padStart(2, '0');
            dom.timerDisplay.textContent = `${m}:${s}`;

            const pct = timerDuration > 0 ? (timerSeconds / timerDuration) * 100 : 0;
            dom.timerBar.style.width = `${pct}%`;
            if (pct > 37.5) dom.timerBar.className = 'h-full transition-all duration-1000 bg-green-500';
            else if (pct > 25) dom.timerBar.className = 'h-full transition-all duration-1000 bg-yellow-500';
            else dom.timerBar.className = 'h-full transition-all duration-1000 bg-red-500';
        }

        // --- Render ---
        // Team colors are user-entered; only allow hex values into style attributes
        const teamColor = (c) => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#eab308';
        const findTeam = (id) => teams.find(t => t.id === id);

        const pillBase = "px-6 py-4 rounded-full text-lg font-bold whitespace-nowrap transition-colors flex-shrink-0";

        function renderTeams() {
            dom.playerList.innerHTML = teams.map(t => {
                const isActive = selectedTeamId === t.id;
                const color = teamColor(t.color);
                let style = `border: 3px solid ${color};`;
                let cls = 'bg-gray-800 text-white';
                if (isActive) { style += `background-color: ${color};`; cls = 'text-black'; }
                else if (t.eliminated) cls = 'bg-gray-800 text-gray-500 line-through opacity-60';
                const count = players.filter(p => p.team_id === t.id).length;
                const doneMark = (state.round_done || []).includes(t.id) ? '✓ ' : '';
                return `<button onclick="window.selectTeam('${t.id}')" class="${pillBase} ${cls}" style="${style}">${doneMark}${t.name} <span class="text-sm font-normal opacity-70">${count}</span></button>`;
            }).join('') || '<div class="text-gray-500 py-2">No teams — add them in Setup</div>';
        }

        window.selectTeam = (id) => {
            selectedTeamId = id;
            ws.setActiveTeam(id);
            ws.showTeamIntro();
            renderPlayers();
            renderWords();
        };

        function renderPlayers() {
            if (gameMode === 'team') return renderTeams();
            dom.playerList.innerHTML = players.map(p => {
                const isActive = selectedPlayerId === p.id;
                const isElim = p.eliminated;
                const baseClass = pillBase;
                let colorClass = "bg-gray-700 text-white";
                if (isActive) colorClass = "bg-yellow-500 text-black";
                else if (isElim) colorClass = "bg-gray-800 text-gray-500 line-through";

                const team = findTeam(p.team_id);
                const dot = team ? `<span class="inline-block w-3 h-3 rounded-full mr-2" style="background-color: ${teamColor(team.color)}"></span>` : '';
                const doneMark = (state.round_done || []).includes(p.id) ? '✓ ' : '';
                return `<button onclick="window.selectPlayer('${p.id}')" class="${baseClass} ${colorClass}">${dot}${doneMark}${p.name}</button>`;
            }).join('');
        }

        window.selectPlayer = (id) => {
            selectedPlayerId = id;
            ws.setActivePlayer(id);
            ws.showPlayerIntro();
            renderPlayers();
            renderWords();
        };

        function renderWords() {
            let filtered = words;
            if (wordTab === 'player' && gameMode === 'team') {
                // Team's pool plus every member's own words
                const memberIds = new Set(players.filter(p => p.team_id === selectedTeamId).map(p => p.id));
                filtered = selectedTeamId ? words.filter(w => memberIds.has(w.player_id) || (!w.player_id && w.team_id === selectedTeamId)) : [];
            } else if (wordTab === 'player' && selectedPlayerId) {
                // Player's own words plus their team's pool
                const teamId = players.find(p => p.id === selectedPlayerId)?.team_id;
                filtered = words.filter(w => w.player_id === selectedPlayerId || (teamId && !w.player_id && w.team_id === teamId));
            } else if (wordTab === 'pool') {
                filtered = words.filter(w => !w.player_id && !w.team_id);
            }

            if (filtered.length === 0) {
                dom.wordList.innerHTML = `<div class="text-center text-gray-500 py-4">No words found</div>`;
                return;
            }

            dom.wordList.innerHTML = filtered.map(w => {
                const isActive = state.current_word_id === w.id;
                const isUsed = w.used;
                const p = players.find(pl => pl.id === w.player_id);
                const team = findTeam(w.team_id);
                const stars = w.difficulty ? '★'.repeat(w.difficulty) : '';

                let classes = "p-3 rounded flex justify-between items-center cursor-pointer border ";
                if (isActive) classes += "bg-yellow-500/20 border-yellow-500 text-white";
                else if (isUsed) classes += "bg-gray-800 border-gray-700 text-gray-500";
                else classes += "bg-gray-700 border-gray-600 text-white";

                return `
                <div onclick="window.selectWord('${w.id}')" class="${classes}">
                    <div>
                        <div class="font-bold text-lg">${w.word} <span class="text-yellow-500 text-sm">${stars}</span></div>
                        <div class="text-xs opacity-70 truncate max-w-[200px]">${w.definition || ''}</div>
                        ${p ? `<div class="text-xs text-blue-400">${p.name}</div>` : ''}
                        ${team ? `<div class="text-xs" style="color: ${teamColor(team.color)}">Team ${team.name}</div>` : ''}
                    </div>
                    ${usedTag(w)}
                </div>`;
            }).join('');
        }

        // Latest judged attempt on a word (a word can be re-asked), shown as "R1 · ✅ Red" with a ⋯ menu
        const RESULT_ICON = { correct: '✅', incorrect: '❌', timeout: '⏰' };
        const latestTurn = (wordId) => turns.filter(t => t.word_id === wordId).at(-1);
        const turnOwnerName = (t) => (t.team_id ? findTeam(t.team_id) : players.find(p => p.id === t.player_id))?.name || '';

        function usedTag(w) {
            const t = latestTurn(w.id);
            if (!t) return w.used ? '<span class="text-xs bg-gray-600 px-2 py-1 rounded">Used</span>' : '';
            return `<div class="flex items-center gap-1 flex-shrink-0">
                <span class="text-xs bg-gray-600 text-gray-200 px-2 py-1 rounded whitespace-nowrap">R${t.round_number} · ${RESULT_ICON[t.result] || ''} ${turnOwnerName(t)}</span>
                <button onclick="event.stopPropagation(); window.openTurnMenu('${t.id}')" class="text-white text-2xl leading-none px-3 py-1 rounded hover:bg-gray-600" aria-label="Edit score">⋯</button>
            </div>`;
        }

        // ⋯ menu: move a scored word to another round, change its result, or remove the score
        let turnDraft = null;
        window.openTurnMenu = (turnId) => {
            const t = turns.find(x => x.id === turnId);
            if (!t) return;
            turnDraft = { id: t.id, round_number: t.round_number, result: t.result, word: words.find(w => w.id === t.word_id)?.word || '', owner: turnOwnerName(t) };
            renderTurnMenu();
        };
        window.closeTurnMenu = () => { turnDraft = null; renderTurnMenu(); };
        window.turnMenuRound = (delta) => { turnDraft.round_number = Math.max(1, turnDraft.round_number + delta); renderTurnMenu(); };
        window.turnMenuResult = (result) => { turnDraft.result = result; renderTurnMenu(); };
        window.saveTurnMenu = () => {
            ws.editTurn(turnDraft.id, { round_number: turnDraft.round_number, result: turnDraft.result });
            window.closeTurnMenu();
        };
        window.removeTurnScore = () => {
            if (!confirm(`Remove the score for "${turnDraft.word}"? The word goes back to unused.`)) return;
            ws.deleteTurn(turnDraft.id);
            window.closeTurnMenu();
        };

        function renderTurnMenu() {
            const el = document.getElementById('turn-menu');
            el.classList.toggle('hidden', !turnDraft);
            if (!turnDraft) return;
            const d = turnDraft;
            const resultBtn = (r, label, color) => `<button onclick="window.turnMenuResult('${r}')" class="flex-1 py-3 rounded-lg font-bold ${d.result === r ? color + ' text-white' : 'bg-gray-700 text-gray-300'}">${label}</button>`;
            el.innerHTML = `
            <div onclick="event.stopPropagation()" class="w-full bg-gray-900 border-t border-gray-600 rounded-t-2xl p-5 space-y-5">
                <div>
                    <div class="text-2xl font-bold">${d.word}</div>
                    <div class="text-sm text-gray-400">${d.owner}</div>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-gray-400">Round</span>
                    <div class="flex items-center gap-3">
                        <button onclick="window.turnMenuRound(-1)" class="bg-gray-700 w-12 h-12 rounded-lg text-2xl font-bold">−</button>
                        <span class="font-mono text-2xl font-bold w-10 text-center">${d.round_number}</span>
                        <button onclick="window.turnMenuRound(1)" class="bg-gray-700 w-12 h-12 rounded-lg text-2xl font-bold">+</button>
                    </div>
                </div>
                <div class="flex gap-2">
                    ${resultBtn('correct', '✅ Correct', 'bg-green-600')}
                    ${resultBtn('incorrect', '❌ Incorrect', 'bg-red-600')}
                    ${resultBtn('timeout', '⏰ Timeout', 'bg-orange-600')}
                </div>
                <button onclick="window.saveTurnMenu()" class="w-full bg-yellow-500 text-black py-4 rounded-xl text-xl font-bold">Save</button>
                <div class="flex gap-3">
                    <button onclick="window.removeTurnScore()" class="flex-1 bg-gray-800 border border-red-500 text-red-400 py-3 rounded-lg font-semibold">Remove score</button>
                    <button onclick="window.closeTurnMenu()" class="flex-1 bg-gray-700 py-3 rounded-lg font-semibold">Cancel</button>
                </div>
            </div>`;
        }

        window.selectWord = (id) => {
            ws.setActiveWord(id);
            // Reset timer when selecting a new word
            timerSeconds = timerDuration;
            stopTimer();
            ws.resetTimer(timerDuration);
            updateTimerDisplay();
        };

        // Tabs
        const tabButtons = {
            player: document.getElementById('tab-player-words'),
            pool: document.getElementById('tab-pool-words'),
            all: document.getElementById('tab-all-words')
        };

        const updateTabs = () => {
            ['player', 'pool', 'all'].forEach(t => {
                if (t === wordTab) tabButtons[t].className = 'px-2 py-1 rounded bg-gray-700 text-white';
                else tabButtons[t].className = 'px-2 py-1 rounded text-gray-400 hover:text-white';
            });
            renderWords();
        };
        tabButtons.player.onclick = () => { wordTab = 'player'; updateTabs(); };
        tabButtons.pool.onclick = () => { wordTab = 'pool'; updateTabs(); };
        tabButtons.all.onclick = () => { wordTab = 'all'; updateTabs(); };

        // Timer buttons
        document.getElementById('btn-timer-start').onclick = () => {
            ws.startTimer();
            startLocalTimer();
        };
        document.getElementById('btn-timer-pause').onclick = () => {
            ws.pauseTimer();
            stopTimer();
        };
        document.getElementById('btn-timer-reset').onclick = () => {
            stopTimer();
            timerSeconds = timerDuration;
            ws.resetTimer(timerDuration);
            updateTimerDisplay();
        };

        // Reveal buttons
        document.querySelectorAll('.reveal-btn').forEach(btn => {
            btn.onclick = () => {
                const type = btn.dataset.type;
                const revealedInfo = state.revealed_info || [];
                if (revealedInfo.includes(type)) ws.hideInfo(type);
                else ws.revealInfo(type);
            };
        });

        // Judge buttons
        // Judging saves the turn on the server (once per word)
        document.getElementById('btn-correct').onclick = () => { stopTimer(); ws.markCorrect(); };
        document.getElementById('btn-incorrect').onclick = () => { stopTimer(); ws.markIncorrect(); };
        document.getElementById('btn-timeout').onclick = () => { stopTimer(); ws.markTimeout(); };
        // Mis-tap: delete the last judged turn and put that word back on screen to judge again
        dom.undo.onclick = () => { stopTimer(); ws.undoResult(); };

        // Quick actions
        document.getElementById('btn-clear').onclick = () => {
            ws.clearDisplay();
            selectedPlayerId = null;
            selectedTeamId = null;
            stopTimer();
            timerSeconds = timerDuration;
            updateTimerDisplay();
        };
        document.getElementById('btn-pronounce').onclick = () => ws.pronounceWord();
        const hideBtn = document.getElementById('btn-hide-word');
        const renderHideBtn = () => {
            hideBtn.textContent = hideWord ? '🙈 TV: first letter + definition only' : '👁 TV: showing the whole word';
            hideBtn.classList.toggle('border-yellow-500', hideWord);
            hideBtn.classList.toggle('text-yellow-300', hideWord);
        };
        hideBtn.onclick = () => {
            hideWord = !hideWord;
            try { localStorage.setItem('hideWord', hideWord ? '1' : '0'); } catch (e) {}
            renderHideBtn();
            ws.setHideWord(hideWord);
        };
        renderHideBtn();
        document.getElementById('btn-scoreboard').onclick = ws.showScoreboard;
        document.getElementById('btn-next-round').onclick = () => {
            const isTeam = gameMode === 'team';
            const done = new Set(state.round_done || []);
            const waiting = (isTeam ? teams : players).filter(x => !x.eliminated && !done.has(x.id));
            if (waiting.length && !confirm(`${waiting.map(x => x.name).join(', ')} haven't gone this round. Start round ${(state.round_number || 1) + 1} anyway?`)) return;
            stopTimer();
            ws.nextRound();
        };

        init();
    </script>
</body>
</html>
