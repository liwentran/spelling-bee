<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display - Spelling Bee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a1a; color: #f5e6c8; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glow { text-shadow: 0 0 20px rgba(245, 230, 200, 0.3); }
        .bg-radial { background: radial-gradient(circle at center, #1a1a3a 0%, #0a0a1a 100%); }
        .word-text { font-size: clamp(60px, 12vw, 160px); line-height: 1.1; white-space: nowrap; }  /* fitText() shrinks long words */

        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; }
        .pulse-glow { animation: pulseGlow 2s infinite; }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        .confetti { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { text-shadow: 0 0 10px rgba(245, 230, 200, 0.2); } 50% { text-shadow: 0 0 30px rgba(245, 230, 200, 0.6); } 100% { text-shadow: 0 0 10px rgba(245, 230, 200, 0.2); } }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        .particle { position: absolute; width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body class="bg-radial h-screen w-screen flex flex-col justify-center items-center relative">

    <div id="click-to-start" class="absolute inset-0 z-50 bg-black/90 flex flex-col items-center justify-center cursor-pointer">
        <h1 class="text-4xl font-serif glow mb-4">🐝 Spelling Bee TV Display</h1>
        <p class="text-xl">Click anywhere to connect and enable audio</p>
        <p class="text-sm text-gray-400 mt-4" id="session-info"></p>
    </div>

    <!-- Shown whenever the browser is blocking sound; clicking it turns sound on (with a test beep) -->
    <button id="sound-off" class="hidden fixed top-4 right-4 z-40 bg-red-700 hover:bg-red-600 text-white text-lg font-bold px-4 py-2 rounded-xl shadow-lg">🔇 Sound is off · click to turn on</button>

    <!-- Views Container -->
    <div id="views" class="w-full h-full flex flex-col justify-center items-center relative z-10 max-w-6xl mx-auto px-8">

        <!-- Idle View -->
        <div id="view-idle" class="text-center w-full fade-in">
            <h1 class="text-8xl font-serif glow font-black mb-8 pulse-glow">🐝 Spelling Bee</h1>
            <h2 id="idle-session-name" class="text-4xl text-yellow-500 opacity-80">Loading...</h2>
            <div id="idle-round" class="mt-8 text-2xl tracking-widest uppercase opacity-50"></div>
        </div>

        <!-- Player Intro View -->
        <div id="view-player-intro" class="hidden text-center w-full slide-up">
            <div class="text-yellow-500 text-3xl mb-4 tracking-widest uppercase">Up Next</div>
            <div id="intro-team" class="hidden inline-block text-2xl font-bold px-6 py-2 rounded-full mb-6 border-2 tracking-wide"></div>
            <h1 id="intro-name" class="text-9xl font-serif glow font-black mb-8 text-white"></h1>
            <div class="flex justify-center space-x-8 text-3xl opacity-80 mb-8">
                <span id="intro-age"></span>
                <span id="intro-grade"></span>
                <span id="intro-school"></span>
            </div>
            <div id="intro-fact" class="text-4xl italic text-yellow-300 opacity-90 max-w-4xl mx-auto"></div>
        </div>

        <!-- Team Intro View (team mode): the team plus every member -->
        <div id="view-team-intro" class="hidden w-full text-center slide-up">
            <div class="text-yellow-500 text-3xl mb-4 tracking-widest uppercase">Up Next</div>
            <h1 id="team-intro-name" class="text-8xl font-serif glow font-black mb-10"></h1>
            <div id="team-intro-members" class="grid gap-6 w-full"></div>
        </div>

        <!-- Spelling Mode -->
        <div id="view-spelling" class="hidden w-full h-full flex flex-col justify-between py-12 fade-in">
            <div class="flex justify-between items-center text-3xl font-bold opacity-70">
                <div id="spell-player" class="uppercase tracking-widest text-yellow-500"></div>
                <div id="spell-round" class="uppercase tracking-widest"></div>
            </div>
            <div id="spell-members" class="hidden flex flex-wrap gap-3 mt-4"></div>

            <div class="flex-grow flex flex-col justify-center items-center text-center">
                <h1 id="spell-word" class="word-text font-serif glow font-black mb-8"></h1>

                <div id="revealed-info" class="flex flex-col items-center space-y-6 w-full max-w-4xl">
                    <!-- Revealed content injected here -->
                </div>
            </div>
        </div>

        <!-- Result Mode -->
        <div id="view-result" class="hidden fixed inset-0 z-30 flex flex-col justify-center items-center px-8 text-center fade-in">
            <div id="result-confetti" class="confetti hidden"></div>
            <div id="result-owner" class="text-5xl font-bold mb-6 tracking-wide"></div>
            <h1 id="result-title" class="text-9xl font-serif font-black mb-8"></h1>
            <h2 id="result-subtitle" class="text-6xl text-white font-serif glow"></h2>
            <div id="result-score" class="text-3xl mt-10 opacity-80 tracking-wider uppercase"></div>
            <div id="result-winner" class="hidden text-7xl font-serif font-black mt-12 text-yellow-300 glow pulse-glow"></div>
        </div>

        <!-- Scoreboard Mode -->
        <div id="view-scoreboard" class="hidden w-full fade-in flex flex-col items-center pt-12">
            <h1 class="text-6xl font-serif glow font-black mb-12">Scoreboard</h1>
            <div id="scoreboard-winner" class="hidden text-6xl font-serif font-black mb-10 text-yellow-300 glow pulse-glow"></div>
            <div id="team-scoreboard" class="hidden w-full max-w-5xl grid gap-4 mb-8"></div>
            <div id="player-scoreboard" class="w-full max-w-5xl bg-gray-900/50 rounded-2xl p-8 border border-gray-700">
                <div class="grid grid-cols-4 gap-4 text-2xl font-bold text-gray-400 mb-6 border-b border-gray-700 pb-4">
                    <div class="col-span-2">Player</div>
                    <div class="text-center">Score</div>
                    <div id="sb-status-header" class="text-right">Status</div>
                </div>
                <div id="scoreboard-list" class="space-y-4 max-h-[60vh] overflow-y-auto pr-4"></div>
            </div>
        </div>
    </div>

    <!-- Timer Bar -->
    <div id="timer-container" class="absolute bottom-0 left-0 w-full h-8 bg-gray-900 hidden z-20">
        <div id="display-timer-bar" class="h-full bg-green-500 transition-all duration-1000 w-full shadow-[0_0_15px_rgba(74,222,128,0.5)]"></div>
        <div id="display-timer-text" class="absolute inset-0 flex items-center justify-center font-bold text-2xl drop-shadow-md"></div>
        <div id="display-timer-paused" class="absolute inset-0 flex items-center justify-center font-black text-2xl bg-black/50 tracking-widest hidden">PAUSED</div>
    </div>

    <script type="module">
        import * as api from './js/api.js';
        import * as ws from './js/ws.js';
        import * as sounds from './js/sounds.js';

        let state = {};
        let lastDisplayMode = null;
        let lastResult = null;
        let lastTickSecond = -1;
        let lastBeepMark = null; // last "time left" mark beeped this countdown
        let lastViewKey = null;   // skip redraws when only the timer changed
        let currentView = null;

        const views = {
            idle: document.getElementById('view-idle'),
            player_intro: document.getElementById('view-player-intro'),
            team_intro: document.getElementById('view-team-intro'),
            spelling: document.getElementById('view-spelling'),
            result: document.getElementById('view-result'),
            scoreboard: document.getElementById('view-scoreboard')
        };

        const dom = {
            clickToStart: document.getElementById('click-to-start'),
            timerContainer: document.getElementById('timer-container'),
            timerBar: document.getElementById('display-timer-bar'),
            timerText: document.getElementById('display-timer-text'),
            timerPaused: document.getElementById('display-timer-paused')
        };

        const sessionId = new URLSearchParams(window.location.search).get('session') || window.location.hash.slice(1);

        // Show session ID hint on click-to-start screen
        if (sessionId) {
            document.getElementById('session-info').textContent = `Session: ${sessionId}`;
        } else {
            document.getElementById('session-info').textContent = 'Add ?session=ID to URL to connect';
        }

        dom.clickToStart.onclick = async () => {
            dom.clickToStart.classList.add('hidden');
            // Unlock audio, then play one beep as an audible check and show/hide the "Sound is off" button
            sounds.initAudio().then(() => { sounds.playBeeps(1); watchSound(); });
            // Speech synthesis needs a user gesture before it will play; prime it here
            if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

            if (sessionId) {
                ws.connect(sessionId);
                ws.onStateUpdate(handleStateUpdate);
                ws.onSound(handleSound);
                ws.onPronounce(handlePronounce);
                try {
                    const sess = await api.getSession(sessionId);
                    document.getElementById('idle-session-name').textContent = sess.name;
                } catch (e) {
                    document.getElementById('idle-session-name').textContent = 'Session not found';
                }
            } else {
                document.getElementById('idle-session-name').textContent = 'No Session Selected';
            }
        };

        function handleSound(sound) {
            switch (sound) {
                case 'bell': sounds.playBell(); break;
                case 'correct': sounds.playCorrect(); break;
                case 'tick': sounds.playTick(); break;
                case 'countdown': sounds.playCountdown(); break;
            }
        }

        function speak(text, rate = 0.9) {
            if (!text || !('speechSynthesis' in window)) return;
            const synth = window.speechSynthesis;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = rate;
            const voice = synth.getVoices().find(v => v.lang === 'en-US' && v.localService) ||
                synth.getVoices().find(v => v.lang.startsWith('en'));
            if (voice) utterance.voice = voice;
            synth.speak(utterance);
        }

        // If the browser blocks or suspends audio (tab muted by policy, reloaded without a click, iOS),
        // say so on screen instead of failing silently
        const soundOff = document.getElementById('sound-off');
        function watchSound() {
            const update = () => soundOff.classList.toggle('hidden', sounds.audioState() === 'running');
            update();
            setInterval(update, 2000);
        }
        soundOff.onclick = () => {
            sounds.initAudio().then(() => { sounds.playBeeps(1); soundOff.classList.toggle('hidden', sounds.audioState() === 'running'); });
        };

        function handlePronounce({ word, rate }) {
            speak(word, rate || 0.8);
        }

        // Spoken form of each hint, read aloud when the controller reveals it
        const HINT_SPEECH = {
            definition: w => w.definition && `Definition: ${w.definition}`,
            sentence: w => w.sentence && `Here it is in a sentence. ${w.sentence}`,
            part_of_speech: w => w.part_of_speech && `Part of speech: ${w.part_of_speech}`,
            origin: w => w.language_of_origin && `Language of origin: ${w.language_of_origin}`,
            // Phonetic spellings like "noo-MOHN-yuh" read better as separate syllables
            alternate_pronunciations: w => w.alternate_pronunciations && `Alternate pronunciation: ${w.alternate_pronunciations.replace(/-/g, ' ')}`,
        };

        function speakNewHints(oldState, s) {
            // Only for the same word: a new word clears hints, and the first state after connecting isn't a reveal
            if (!s.word || s.current_word_id !== oldState.current_word_id) return;
            const before = new Set(oldState.revealed_info || []);
            const added = (s.revealed_info || []).filter(type => !before.has(type));
            const text = added.map(type => HINT_SPEECH[type]?.(s.word)).filter(Boolean).join('. ');
            speak(text);
        }

        // Escape user/AI-entered text before putting it into innerHTML
        // Show grades as "6th Grade" whatever was typed: "6", "6th", "6th grade", "Grade 6", "K"
        function formatGrade(grade) {
            const g = String(grade ?? '').trim();
            if (!g) return '';
            if (/^(k|kg|kindergarten)$/i.test(g)) return 'Kindergarten';
            const m = g.match(/^(?:grade\s*)?(\d{1,2})(?:st|nd|rd|th)?(?:\s*grade)?(.*)$/i);
            if (!m) return g; // free text (e.g. "Pre-K", "Senior") is shown as-is
            const n = parseInt(m[1]);
            const suffix = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
            return `${n}${suffix} Grade${m[2]}`; // keeps extras like " (honors)"
        }

        const esc = (str) => String(str ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

        // Team colors are user-entered; only allow hex values into style attributes
        const teamColor = (c) => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#eab308';

        function handleStateUpdate(msg) {
            const s = msg.state;
            const oldState = state;
            state = s;

            // Play sounds on result transitions
            if (s.display_mode === 'result' && oldState.display_mode !== 'result') {
                if (s.result === 'correct') {
                    sounds.playCorrect();
                } else {
                    sounds.playBell();
                }
            }

            // Timer tick sounds in last 10 seconds
            if (s.display_mode === 'spelling' && s.timer_running && s.timer_seconds_remaining <= 10 && s.timer_seconds_remaining > 0) {
                const currentSecond = Math.ceil(s.timer_seconds_remaining);
                if (currentSecond !== lastTickSecond) {
                    lastTickSecond = currentSecond;
                    if (s.timer_seconds_remaining <= 5) {
                        sounds.playCountdown();
                    } else {
                        sounds.playTick();
                    }
                }
            }

            // Every 30 seconds left, beep once per 30 seconds remaining (3 beeps = 1:30 left, 1 beep = 0:30)
            const remaining = s.timer_seconds_remaining;
            if (lastBeepMark !== null && remaining > lastBeepMark) lastBeepMark = null; // clock was reset
            if (s.display_mode === 'spelling' && s.timer_running && remaining > 0 && remaining < s.timer_duration
                && remaining % 30 === 0 && remaining !== lastBeepMark) {
                lastBeepMark = remaining;
                sounds.playBeeps(Math.min(remaining / 30, 10)); // cap so very long timers stay sensible
            }

            speakNewHints(oldState, s);
            // The controller sends a timer tick every second; redrawing the view for those
            // replays its fade/slide animations and makes the screen flash. Only redraw when
            // something other than the timer changed.
            const { timer_running, timer_seconds_remaining, timer_duration, ...viewState } = s;
            const viewKey = JSON.stringify([viewState, msg.scoreboard, msg.team_scoreboard, msg.winner]);
            if (viewKey !== lastViewKey) {
                lastViewKey = viewKey;
                updateView(msg);
                fitAll();
            }
            updateTimer();
        }

        // Shrink big one-line text (words, names) until it fits the screen width
        const vw = () => window.innerWidth / 100;
        const FIT = {
            'spell-word':      () => Math.min(160, Math.max(60, 12 * vw())),
            'result-subtitle': () => Math.min(128, Math.max(48, 9 * vw())),
            'result-title':    () => 128,
            'result-owner':    () => 48,
            'intro-name':      () => 128,
            'team-intro-name': () => 96,
        };
        function fitText(el, maxPx, minPx = 20) {
            if (!el || !el.offsetParent) return; // hidden: nothing to measure
            el.style.whiteSpace = 'nowrap';
            el.style.maxWidth = '100%'; // centered flex children otherwise grow past the screen instead of overflowing
            el.style.fontSize = `${maxPx}px`;
            const available = el.clientWidth;
            if (available && el.scrollWidth > available) {
                el.style.fontSize = `${Math.max(minPx, Math.floor(maxPx * available / el.scrollWidth * 0.97))}px`;
            }
        }
        const fitAll = () => Object.entries(FIT).forEach(([id, max]) => fitText(document.getElementById(id), max()));
        window.addEventListener('resize', fitAll);

        function switchView(viewName) {
            if (viewName === currentView) return; // same screen: content was updated in place, don't replay the entrance animation
            currentView = viewName;
            Object.entries(views).forEach(([name, el]) => {
                if (name === viewName) {
                    el.classList.remove('hidden');
                    // Re-trigger animation
                    el.style.animation = 'none';
                    el.offsetHeight;
                    el.style.animation = null;
                } else {
                    el.classList.add('hidden');
                }
            });
        }

        function updateView(msg) {
            const s = state;
            const player = s.player;  // Included in state broadcast by backend
            const word = s.word;      // Included in state broadcast by backend
            const team = s.team;      // Team mode: team at the mic, with members

            switch (s.display_mode) {
                case 'idle':
                    document.getElementById('idle-round').textContent = s.round_number ? `Round ${s.round_number}` : '';
                    switchView('idle');
                    break;

                case 'player_intro':
                    if (player) {
                        document.getElementById('intro-name').textContent = player.name;
                        document.getElementById('intro-age').textContent = player.age ? `Age ${player.age}` : '';
                        document.getElementById('intro-grade').textContent = formatGrade(player.grade);
                        document.getElementById('intro-school').textContent = player.school || '';
                        document.getElementById('intro-fact').textContent = player.fun_fact ? `"${player.fun_fact}"` : '';
                        const introTeam = document.getElementById('intro-team');
                        introTeam.classList.toggle('hidden', !player.team);
                        if (player.team) {
                            introTeam.textContent = `Team ${player.team.name}`;
                            introTeam.style.color = teamColor(player.team.color);
                            introTeam.style.borderColor = teamColor(player.team.color);
                        }
                    }
                    switchView('player_intro');
                    break;

                case 'team_intro':
                    if (team) {
                        const nameEl = document.getElementById('team-intro-name');
                        nameEl.textContent = team.name;
                        nameEl.style.color = teamColor(team.color);
                        const members = team.members || [];
                        const grid = document.getElementById('team-intro-members');
                        grid.style.gridTemplateColumns = `repeat(${Math.min(Math.max(members.length, 1), 4)}, minmax(0, 1fr))`;
                        grid.innerHTML = members.map(m => {
                            const isSpeller = s.current_player_id === m.id;
                            const meta = [m.age ? `Age ${m.age}` : '', formatGrade(m.grade), m.school].filter(Boolean).map(esc).join(' · ');
                            return `
                            <div class="bg-gray-900/60 rounded-2xl p-6 border-2 slide-up" style="border-color: ${isSpeller ? teamColor(team.color) : 'rgba(75,85,99,0.6)'}">
                                ${isSpeller ? `<div class="text-sm font-bold uppercase tracking-widest mb-2" style="color: ${teamColor(team.color)}">Spelling</div>` : ''}
                                <div class="text-4xl font-serif font-black text-white mb-2">${esc(m.name)}</div>
                                <div class="text-xl opacity-80 mb-3">${meta}</div>
                                ${m.fun_fact ? `<div class="text-xl italic text-yellow-300 opacity-90">"${esc(m.fun_fact)}"</div>` : ''}
                            </div>`;
                        }).join('');
                    }
                    switchView('team_intro');
                    break;

                case 'spelling':
                    const spellPlayer = document.getElementById('spell-player');
                    const spellMembers = document.getElementById('spell-members');
                    spellMembers.classList.toggle('hidden', !(s.game_mode === 'team' && team));
                    if (s.game_mode === 'team' && team) {
                        // Team mode: team name in its color, member chips with the speller highlighted
                        spellPlayer.textContent = team.name;
                        spellPlayer.style.color = teamColor(team.color);
                        spellMembers.innerHTML = (team.members || []).map(m => {
                            const on = s.current_player_id === m.id;
                            return `<span class="px-4 py-1 rounded-full text-xl border-2 ${on ? 'font-bold text-black' : 'opacity-70'}" style="border-color: ${teamColor(team.color)};${on ? ` background-color: ${teamColor(team.color)};` : ''}">${esc(m.name)}</span>`;
                        }).join('');
                    } else if (player) {
                        spellPlayer.style.color = '';
                        spellPlayer.textContent = player.team ? `${player.name} · ${player.team.name}` : player.name;
                    }
                    document.getElementById('spell-round').textContent = `Round ${s.round_number}`;

                    if (word) {
                        const wordEl = document.getElementById('spell-word');
                        if (s.hide_word) {
                            // First letter only; the rest is a blurred placeholder of the same length
                            const rest = '•'.repeat(Math.max(word.word.length - 1, 0));
                            wordEl.innerHTML = `${esc(word.word.charAt(0))}<span class="select-none" style="filter: blur(0.12em); opacity: 0.6" aria-hidden="true">${rest}</span>`;
                        } else {
                            wordEl.textContent = word.word;
                        }

                        const revInfo = document.getElementById('revealed-info');
                        revInfo.innerHTML = '';

                        const revealedInfo = s.revealed_info || [];
                        const infoClass = "bg-gray-800/80 p-4 rounded-xl border border-gray-600 text-2xl w-full text-center slide-up shadow-lg";
                        const smallClass = "bg-gray-800/50 px-6 py-2 rounded-full border border-gray-700 text-xl inline-block mx-2 slide-up";

                        // Hidden-word mode always shows the definition
                        if ((s.hide_word || revealedInfo.includes('definition')) && word.definition) {
                            revInfo.innerHTML += `<div class="${infoClass}">📖 ${word.definition}</div>`;
                        }
                        if (revealedInfo.includes('sentence') && word.sentence) {
                            revInfo.innerHTML += `<div class="${infoClass} italic">📝 "${word.sentence}"</div>`;
                        }

                        let badges = '';
                        if (revealedInfo.includes('part_of_speech') && word.part_of_speech) {
                            badges += `<div class="${smallClass}">🔤 ${word.part_of_speech}</div>`;
                        }
                        if (revealedInfo.includes('origin') && word.language_of_origin) {
                            badges += `<div class="${smallClass}">🌍 ${word.language_of_origin}</div>`;
                        }
                        if (revealedInfo.includes('alternate_pronunciations') && word.alternate_pronunciations) {
                            badges += `<div class="${smallClass}">🔊 ${word.alternate_pronunciations}</div>`;
                        }
                        if (badges) revInfo.innerHTML += `<div>${badges}</div>`;
                    }
                    switchView('spelling');
                    break;

                case 'result':
                    const rTitle = document.getElementById('result-title');
                    const rSub = document.getElementById('result-subtitle');
                    const confetti = document.getElementById('result-confetti');

                    confetti.classList.add('hidden');
                    rSub.textContent = '';

                    // Who just spelled, and their running total (scores arrive with the result broadcast)
                    const rOwner = document.getElementById('result-owner');
                    const rScore = document.getElementById('result-score');
                    const rWinner = document.getElementById('result-winner');
                    const isTeamTurn = s.game_mode === 'team';
                    const ownerName = isTeamTurn ? team?.name : player?.name;
                    rOwner.textContent = ownerName || '';
                    rOwner.style.color = isTeamTurn && team ? teamColor(team.color) : '';
                    const row = isTeamTurn
                        ? (msg.team_scoreboard || []).find(t => t.team_id === s.current_team_id)
                        : (msg.scoreboard || []).find(p => p.player_id === s.current_player_id);
                    const out = row?.eliminated ? ' · Eliminated' : '';
                    rScore.textContent = row ? `${row.total_correct} of ${row.total_attempts} correct${out}` : '';
                    rWinner.classList.toggle('hidden', !msg.winner);
                    rWinner.textContent = msg.winner ? `🏆 ${msg.winner.name} wins!` : '';
                    // Reset bg classes
                    // Covers the whole screen (not just the content column) in the result's color
                    views.result.className = 'fixed inset-0 z-30 flex flex-col justify-center items-center px-8 text-center fade-in transition-colors duration-300';

                    if (s.result === 'correct') {
                        views.result.classList.add('bg-green-600');
                        rTitle.textContent = '✓ CORRECT';
                        rTitle.className = 'text-9xl font-serif font-black mb-8 text-white drop-shadow-lg';
                        createConfetti();
                        confetti.classList.remove('hidden');
                    } else if (s.result === 'incorrect') {
                        views.result.classList.add('bg-red-700');
                        rTitle.textContent = '✗ INCORRECT';
                        rTitle.className = 'text-9xl font-serif font-black mb-8 text-white drop-shadow-lg shake';
                        if (word) rSub.textContent = word.word;
                    } else if (s.result === 'timeout') {
                        views.result.classList.add('bg-orange-600');
                        rTitle.textContent = "⏰ TIME'S UP";
                        rTitle.className = 'text-9xl font-serif font-black mb-8 text-white drop-shadow-lg shake';
                        if (word) rSub.textContent = word.word;
                    }
                    switchView('result');
                    break;

                case 'scoreboard':
                    const scoreboard = msg.scoreboard || [];
                    const teamScoreboard = msg.team_scoreboard || [];
                    const teamSb = document.getElementById('team-scoreboard');
                    const isTeamGame = s.game_mode === 'team';
                    teamSb.classList.toggle('hidden', teamScoreboard.length === 0);
                    // Team games spell as a chain, so there are no per-player scores to show
                    document.getElementById('player-scoreboard').classList.toggle('hidden', isTeamGame);
                    const sbWinner = document.getElementById('scoreboard-winner');
                    sbWinner.classList.toggle('hidden', !msg.winner);
                    sbWinner.textContent = msg.winner ? `🏆 ${msg.winner.name} wins!` : '';
                    // Small list of each team's players, from the per-player rows
                    // Active/Eliminated only means something in elimination games
                    const showStatus = !!s.elimination_mode;
                    document.getElementById('sb-status-header').classList.toggle('invisible', !showStatus);
                    const memberNames = (teamId) => esc(scoreboard.filter(p => p.team_id === teamId).map(p => p.player_name).join(' · '));
                    if (isTeamGame) {
                        // Team game: ranked team rows are the main scoreboard
                        teamSb.style.gridTemplateColumns = '1fr';
                        teamSb.innerHTML = teamScoreboard.map((t, i) => `
                        <div class="flex items-center gap-6 bg-gray-900/60 rounded-2xl px-8 py-5 border-l-8 ${t.eliminated ? 'opacity-40' : ''}" style="border-color: ${teamColor(t.team_color)}">
                            <div class="text-3xl font-black opacity-40 w-12" title="Turn order">${i + 1}</div>
                            <div class="flex-1 min-w-0">
                                <div class="text-4xl font-bold ${t.eliminated ? 'line-through' : ''}" style="color: ${teamColor(t.team_color)}">${esc(t.team_name)}</div>
                                <div class="text-lg text-gray-300 opacity-80 mt-1 truncate">${memberNames(t.team_id)}</div>
                            </div>
                            <div class="text-4xl font-mono font-black">${t.total_correct}<span class="text-2xl opacity-50"> / ${t.total_attempts}</span></div>
                            ${showStatus ? `<div class="text-xl uppercase tracking-wider w-48 text-right">${t.eliminated ? `Eliminated R${t.rounds_survived + 1}` : 'Active'}</div>` : ''}
                        </div>`).join('');
                    } else {
                        teamSb.style.gridTemplateColumns = `repeat(${Math.min(teamScoreboard.length, 4) || 1}, minmax(0, 1fr))`;
                        teamSb.innerHTML = teamScoreboard.map(t => `
                            <div class="bg-gray-900/60 rounded-2xl p-6 border-2 text-center" style="border-color: ${teamColor(t.team_color)}">
                                <div class="text-2xl font-bold uppercase tracking-wider" style="color: ${teamColor(t.team_color)}">${t.team_name}</div>
                                <div class="text-5xl font-mono font-black my-2">${t.total_correct}<span class="text-2xl opacity-50"> / ${t.total_attempts}</span></div>
                                <div class="text-base text-gray-300 opacity-80 mt-1">${memberNames(t.team_id)}</div>
                                ${showStatus ? `<div class="text-lg opacity-60">${t.active_count} of ${t.players_count} active</div>` : ''}
                            </div>`).join('');
                    }

                    const sbList = document.getElementById('scoreboard-list');
                    sbList.innerHTML = scoreboard.map(p => {
                        const isElim = p.eliminated;
                        const total = p.total_correct + p.total_incorrect + p.total_timeout;
                        const rowClass = `grid grid-cols-4 gap-4 text-3xl py-4 items-center border-b border-gray-800 ${isElim ? 'opacity-40 line-through' : ''}`;
                        return `
                        <div class="${rowClass}">
                            <div class="col-span-2 font-bold flex items-center gap-3">
                                ${p.team_name ? `<span class="w-4 h-4 rounded-full flex-shrink-0" style="background-color: ${teamColor(p.team_color)}" title="${p.team_name}"></span>` : ''}
                                ${p.player_name}
                                ${p.team_name ? `<span class="text-lg font-normal opacity-60">${p.team_name}</span>` : ''}
                            </div>
                            <div class="text-center font-mono">${p.total_correct} / ${total}</div>
                            <div class="text-right text-xl uppercase tracking-wider">${showStatus ? (isElim ? `Eliminated R${p.rounds_survived + 1}` : 'Active') : ''}</div>
                        </div>`;
                    }).join('');
                    switchView('scoreboard');
                    break;
            }

            lastDisplayMode = s.display_mode;
            lastResult = s.result;
        }

        function updateTimer() {
            const s = state;
            if (s.display_mode === 'spelling' && s.timer_duration > 0) {
                dom.timerContainer.classList.remove('hidden');

                const remaining = s.timer_seconds_remaining || 0;
                const duration = s.timer_duration || 120;
                const pct = duration > 0 ? (remaining / duration) * 100 : 0;

                dom.timerBar.style.width = `${pct}%`;

                // Same thresholds as the controller's bar, relative to this session's timer length
                let colorClass = 'bg-green-500 shadow-[0_0_15px_rgba(74,222,128,0.5)]';
                if (pct <= 25) colorClass = 'bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]';
                else if (pct <= 37.5) colorClass = 'bg-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.5)]';

                dom.timerBar.className = `h-full transition-all duration-1000 ${colorClass}`;

                if (remaining <= 30) {
                    dom.timerText.textContent = Math.ceil(remaining);
                } else {
                    dom.timerText.textContent = '';
                }

                if (!s.timer_running && remaining > 0 && remaining < duration) {
                    dom.timerPaused.classList.remove('hidden');
                } else {
                    dom.timerPaused.classList.add('hidden');
                }
            } else {
                dom.timerContainer.classList.add('hidden');
            }
        }

        function createConfetti() {
            const container = document.getElementById('result-confetti');
            container.innerHTML = '';
            const colors = ['#4ade80', '#fbbf24', '#60a5fa', '#f87171', '#a78bfa', '#fb923c'];
            for (let i = 0; i < 80; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = '-10px';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.width = (Math.random() * 8 + 6) + 'px';
                p.style.height = (Math.random() * 8 + 6) + 'px';

                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 0.5;

                p.animate([
                    { transform: 'translate3d(0,0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate3d(${Math.random() * 200 - 100}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });
                container.appendChild(p);
            }
        }
    </script>
</body>
</html>
